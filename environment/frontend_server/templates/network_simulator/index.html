<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#22810;&#32593;&#32476;&#33286;&#35770;&#20256;&#25773;&#20223;&#30495;</title>
  <style>
    :root{--bg:#eef2f8;--panel:#fff;--panel-soft:#f8fafc;--line:#dde4ee;--text:#1a2332;--muted:#64748b;--blue:#2563eb;--orange:#ea580c;--red:#dc2626;--green:#16a34a;--purple:#7c3aed;--ink:#0f172a;--shadow:0 4px 18px rgba(15,23,42,.08);--radius:10px}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;background:linear-gradient(165deg,#eef2f8 0%,#e8edf5 45%,#f4f6fa 100%);color:var(--text)}
    .app{height:100vh;display:grid;grid-template-rows:60px 1fr}.toolbar{display:flex;align-items:center;gap:12px;padding:0 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.8) inset}
    .brand{font-size:17px;font-weight:700;white-space:nowrap;letter-spacing:.02em;color:var(--ink)}.tabs{display:flex;gap:6px;flex-wrap:wrap}.actions{margin-left:auto;display:flex;gap:8px;align-items:center}
    button{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;font:inherit;font-size:13px;transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}button:hover{background:var(--panel-soft);box-shadow:0 2px 8px rgba(15,23,42,.06)}button:active{transform:translateY(1px)}button.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 14px rgba(15,23,42,.18)}
    .primary{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:#2563eb;color:#fff}.primary:hover{background:linear-gradient(135deg,#4f8ff7,#2f6fe9)}.danger{background:linear-gradient(135deg,#ef4444,#dc2626);border-color:#dc2626;color:#fff}.ghost{background:var(--panel-soft);border-color:transparent}
    .layout{height:100%;min-height:0;display:grid;grid-template-columns:340px minmax(520px,1fr)400px;grid-template-rows:minmax(0,1fr);grid-template-areas:"live canvas coeff";gap:0;padding:10px 10px 10px 0}
    .panel{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}.panel h2{margin:0;padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#f8fafc);color:var(--ink)}.body{padding:12px;overflow:auto;min-height:0}
    .live{grid-area:live}.canvas-wrap{grid-area:canvas;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .coeff{grid-area:coeff}
    .network-intro{flex-shrink:0;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#f8fbff,#fff);line-height:1.55}
    .intro-card{font-size:13px;color:#475569}.intro-card strong{display:block;font-size:15px;margin-bottom:4px;color:var(--ink)}.intro-meta{color:var(--muted);font-size:12px;display:block;margin-bottom:6px}.intro-card p{margin:0}
    .canvas-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(37,99,235,.04) 0%,transparent 65%),linear-gradient(rgba(31,41,55,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(31,41,55,.035) 1px,transparent 1px);background-size:auto,24px 24px,24px 24px}
    #networkCanvas{width:100%;height:100%;display:block;cursor:crosshair;flex:1;min-height:0}
    .agent-tooltip{position:fixed;z-index:30;display:none;max-width:400px;max-height:min(72vh,520px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:14px;background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 48px rgba(15,23,42,.2);pointer-events:none;line-height:1.5;font-size:13px;-webkit-overflow-scrolling:touch}.agent-tooltip.visible{display:block;pointer-events:auto}.agent-tooltip.pinned{border-color:var(--blue);box-shadow:0 18px 48px rgba(37,99,235,.28)}
    .metric-bar{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(5,minmax(88px,1fr));gap:8px;pointer-events:none}.metric{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:8px 10px;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(15,23,42,.08)}.metric span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.metric strong{font-size:16px;color:var(--ink)}
    .speech{border:1px solid var(--line);border-left:4px solid var(--blue);padding:10px 12px;margin-bottom:10px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(15,23,42,.04)}.speech.reflect{border-left-color:var(--purple);background:linear-gradient(90deg,#faf8ff,#fff)}.meta{color:var(--muted);font-size:12px;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}.speech p{margin:0;line-height:1.6;font-size:13px;color:#334155}
    .section{margin-bottom:12px;line-height:1.55;font-size:13px}.section strong{display:block;margin-bottom:5px}.tag-row{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:4px 8px;border-radius:999px;background:#edf2f7;color:#344054;font-size:11px;font-weight:500}
    .agent-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.agent-grid div{background:var(--panel-soft);border-radius:8px;padding:8px;font-size:13px}.small-list{margin:0;padding-left:18px}.small-list li{margin-bottom:5px}
    .coeff-hint{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px;padding:8px 10px;background:var(--panel-soft);border-radius:8px;border:1px dashed var(--line)}
    .state-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.legend-item{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);padding:3px 8px;background:#fff;border:1px solid var(--line);border-radius:999px}.legend-dot{width:8px;height:8px;border-radius:50%}
    .agent-list{display:flex;flex-direction:column;gap:8px}.agent-card{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 11px 10px 13px;background:#fff;cursor:pointer;transition:box-shadow .15s,transform .12s,border-color .15s;--state-color:#9aa4b2;border-left:4px solid var(--state-color);box-shadow:0 1px 3px rgba(15,23,42,.05)}.agent-card::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,color-mix(in srgb,var(--state-color) 12%,transparent),transparent 55%);pointer-events:none}.agent-card:hover{box-shadow:0 6px 16px rgba(15,23,42,.1);transform:translateY(-1px)}.agent-card.is-highlight{box-shadow:0 0 0 2px var(--blue),0 6px 16px rgba(37,99,235,.15)}.agent-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;position:relative;z-index:1}.agent-card-head strong{font-size:13px;color:var(--ink);line-height:1.35}.agent-card-id{color:var(--muted);font-weight:500;font-size:12px}.state-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;color:#fff;background:var(--state-color);white-space:nowrap;flex-shrink:0}.agent-persona{font-size:12px;color:var(--muted);margin-bottom:8px;position:relative;z-index:1}.metric-row{display:grid;grid-template-columns:42px 1fr 36px;align-items:center;gap:6px;font-size:11px;margin-bottom:4px;position:relative;z-index:1}.metric-row span{color:var(--muted)}.metric-row em{font-style:normal;font-weight:600;color:var(--ink);text-align:right}.bar-track{height:6px;border-radius:999px;background:#e8edf3;overflow:hidden}.bar-fill{height:100%;border-radius:999px;transition:width .35s ease}.bar-fill.emotion{background:linear-gradient(90deg,#86efac,#fbbf24,#f87171)}.bar-fill.osi{background:linear-gradient(90deg,#93c5fd,#2563eb)}.bar-fill.cpi{background:linear-gradient(90deg,#c4b5fd,#7c3aed)}.bar-fill.pressure{background:linear-gradient(90deg,#fcd34d,#ea580c)}.pressure-warn .bar-fill.pressure{background:linear-gradient(90deg,#fb923c,#dc2626)}
    .modal{position:fixed;inset:0;display:none;z-index:20}.modal.open{display:block}.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.48)}.dialog{position:absolute;inset:42px;display:grid;grid-template-rows:58px 1fr;background:#fff;border-radius:10px;box-shadow:0 24px 80px rgba(15,23,42,.28);overflow:hidden}
    .dialog-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:18px}.dialog-actions{margin-left:auto;display:flex;gap:8px}.report-body{overflow:auto;background:#f7f9fc;padding:18px}
    .report{max-width:1080px;margin:0 auto;display:grid;gap:14px}.report-title{background:#111827;color:#fff;border-radius:8px;padding:18px}.report-title h1{margin:0 0 8px;font-size:24px}.report-title p{margin:0;color:#d1d5db}
    .report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.report-stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.report-stat span{display:block;color:var(--muted);font-size:12px}.report-stat strong{font-size:22px}
    .report-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px}.report-card h3{margin:0 0 10px;font-size:16px}.report-card ul{margin:0;padding-left:20px}.report-card li{margin-bottom:6px;line-height:1.55}
    .accent-blue{border-left:4px solid var(--blue)}.accent-orange{border-left:4px solid var(--orange)}.accent-green{border-left:4px solid var(--green)}.accent-purple{border-left:4px solid var(--purple)}.evidence{background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:9px;margin-bottom:8px;line-height:1.55}
    .markdown-source{display:none;white-space:pre-wrap;background:#0f172a;color:#e5e7eb;padding:16px;border-radius:8px;line-height:1.55}.markdown-source.open{display:block}
    @media(max-width:1180px){body{overflow:auto}.app{height:auto;min-height:100vh}.toolbar{align-items:flex-start;flex-direction:column}.actions{margin-left:0}.layout{display:block}.panel{max-height:520px;border-left:0;border-right:0}.canvas-wrap{height:68vh}.dialog{inset:12px}.report-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">&#22810;&#32593;&#32476;&#33286;&#35770;&#20256;&#25773;&#20223;&#30495;</div>
      <nav id="networkTabs" class="tabs"></nav>
      <div class="actions">
        <button id="reportBtn">&#25171;&#24320;&#30740;&#31350;&#35777;&#25454;&#25991;&#26723;</button>
        <button id="startBtn" class="primary">&#24320;&#22987;</button>
        <button id="pauseBtn">&#26242;&#20572;</button>
        <button id="stepBtn">&#21333;&#27493;</button>
        <button id="interventionBtn">&#24178;&#39044;</button>
        <button id="resetBtn" class="danger">&#37325;&#32622;</button>
      </div>
    </header>
    <main class="layout">
      <aside class="panel live"><h2>&#24038;&#20391;&#33286;&#35770;&#23454;&#20917;</h2><div id="speechPanel" class="body"></div></aside>
      <section class="canvas-wrap">
        <div id="networkIntro" class="network-intro"></div>
        <div class="canvas-stage"><canvas id="networkCanvas"></canvas><div id="metricBar" class="metric-bar"></div></div>
      </section>
      <aside class="panel coeff"><h2>Agent &#31995;&#25968;&#30417;&#27979;</h2><div id="coeffPanel" class="body"></div></aside>
    </main>
  </div>

  <div id="reportModal" class="modal">
    <div id="modalBackdrop" class="backdrop"></div>
    <section class="dialog">
      <header class="dialog-head">
        <h2>&#20256;&#25773;&#26426;&#21046;&#19982;&#35777;&#25454;&#25991;&#26723;</h2>
        <div class="dialog-actions">
          <button id="toggleMarkdownBtn" class="ghost">Markdown &#28304;&#25991;</button>
          <button id="closeReportBtn" class="danger">&#20851;&#38381;</button>
        </div>
      </header>
      <div class="report-body">
        <article id="renderedReport" class="report"></article>
        <pre id="markdownSource" class="markdown-source"></pre>
      </div>
    </section>
  </div>

  <div id="agentTooltip" class="agent-tooltip" aria-hidden="true"></div>

  <script>
    const $=id=>document.getElementById(id),canvas=$("networkCanvas"),ctx=canvas.getContext("2d");
    const networkTabs=$("networkTabs"),metricBar=$("metricBar"),networkIntro=$("networkIntro"),speechPanel=$("speechPanel"),coeffPanel=$("coeffPanel"),agentTooltip=$("agentTooltip");
    const reportModal=$("reportModal"),renderedReport=$("renderedReport"),markdownSource=$("markdownSource"),toggleMarkdownBtn=$("toggleMarkdownBtn");
    const colors={UNAWARE:"#9aa4b2",EXPOSED:"#2563eb",LISTENING:"#56a3d9",TALKING:"#ea580c",QUESTIONING:"#eab308",DEBUNKING:"#16a34a",SILENT:"#8e99ab",REFLECTING:"#7c3aed"};
    const STATE_KEYS=["UNAWARE","EXPOSED","LISTENING","TALKING","QUESTIONING","DEBUNKING","SILENT","REFLECTING"];
    function stateColor(k){return colors[k]||"#9aa4b2"}
    function barPct(v,max=1){return Math.min(100,Math.max(4,(Number(v)/max)*100))}
    function metricBarRow(label,value,cls,max){return `<div class="metric-row"><span>${label}</span><div class="bar-track"><div class="bar-fill ${cls}" style="width:${barPct(value,max)}%"></div></div><em>${value}</em></div>`}
    function agentCardHtml(r){const sk=r.stateKey||"UNAWARE",sc=stateColor(sk),hi=highlightAgentId()===r.id,pr=r.threshold>0?r.pressure/r.threshold:0;return `<article class="agent-card${hi?" is-highlight":""}${pr>=0.85?" pressure-warn":""}" data-id="${r.id}" style="--state-color:${sc}"><div class="agent-card-head"><strong><span class="agent-card-id">${r.id}</span> ${r.name||""}</strong><span class="state-badge">${r.state}</span></div><div class="agent-persona">${r.personaType}</div>${metricBarRow("情绪",r.emotion,"emotion")}${metricBarRow("OSI",r.osi,"osi")}${metricBarRow("CPI",r.cpi,"cpi")}${metricBarRow("H/θ",Math.min(1,pr),"pressure",1)}</article>`}
    let sim=null,positions=new Map(),hoverAgentId=null,pinnedAgentId=null,pinnedTooltipPos=null,timer=null,lastLayoutKey="",isRunning=false;
    const METRIC_RESERVE=92;
    function highlightAgentId(){return pinnedAgentId||hoverAgentId}
    async function api(url,payload){const opt=payload?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}:{};const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
    async function loadState(){sim=await api("/api/simulation/state/");ensureLayout();renderAll()}
    async function reset(type){stop();sim=await api("/api/simulation/reset/",{network_type:type||sim.networkType});hoverAgentId=null;pinnedAgentId=null;pinnedTooltipPos=null;lastLayoutKey="";ensureLayout();renderAll();syncPinnedTooltip()}
    async function step(intervention){sim=await api("/api/simulation/step/",intervention?{intervention}:{});ensureLayout();renderAll()}
    function start(){if(!timer){isRunning=true;timer=setInterval(()=>step().catch(stop),1800);renderCanvas();renderMetrics()}}
    function stop(){if(timer)clearInterval(timer);timer=null;isRunning=false;if(sim){sim.activeFlows=[];renderCanvas();renderMetrics()}}
    function ensureLayout(){const dpr=window.devicePixelRatio||1,rect=canvas.getBoundingClientRect();canvas.width=Math.max(320,rect.width*dpr);canvas.height=Math.max(320,rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const key=`${sim.networkType}:${sim.nodes.length}:${Math.round(rect.width)}:${Math.round(rect.height)}`;if(key===lastLayoutKey)return;lastLayoutKey=key;positions=new Map();const w=rect.width,h=rect.height,plotH=Math.max(200,h-METRIC_RESERVE),cx=w/2,cy=plotH/2,radius=Math.min(w,plotH)*.38;sim.nodes.forEach((node,i)=>{const a=Math.PI*2*i/sim.nodes.length-Math.PI/2,j=.86+(i%5)/28;positions.set(node.id,{x:cx+Math.cos(a)*radius*j,y:cy+Math.sin(a)*radius*j})})}
    function renderAll(){renderTabs();renderNetworkIntro();renderMetrics();renderCanvas();renderSpeeches();renderCoefficients();syncPinnedTooltip();if(reportModal.classList.contains("open"))renderResearchReport()}
    function renderTabs(){networkTabs.innerHTML=sim.scenarios.map(s=>`<button class="${s.type===sim.networkType?"active":""}" data-type="${s.type}" title="${s.model} / ${s.sceneName}">${s.label}</button>`).join("");networkTabs.querySelectorAll("button").forEach(b=>b.onclick=()=>reset(b.dataset.type))}
    function renderNetworkIntro(){const s=sim.scenarios.find(x=>x.type===sim.networkType);networkIntro.innerHTML=`<article class="intro-card"><strong>${s?s.label:sim.sceneName}</strong><span class="intro-meta">${sim.sceneName} / ${sim.model}</span><p>${sim.description||(s&&s.description)||""}</p></article>`}
    function renderMetrics(){const m=sim.report.networkMetrics;metricBar.innerHTML=[["时间步",sim.timeStep],["平均度",m.averageDegree],["情绪",m.averageEmotion],["平均 OSI",m.averageOsi],["状态",isRunning?"运行中":"已暂停"]].map(x=>`<div class="metric"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}
    function renderCanvas(){if(!sim)return;const rect=canvas.getBoundingClientRect();ctx.clearRect(0,0,rect.width,rect.height);sim.edges.forEach(e=>{const a=positions.get(e.source),b=positions.get(e.target);if(!a||!b)return;ctx.strokeStyle=e.relationType&&e.relationType.includes("紧张")?"rgba(235,87,87,.25)":"rgba(69,84,105,.16)";ctx.lineWidth=e.relationType&&e.relationType.includes("紧张")?1.5:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});
      if(isRunning){const t=performance.now()/1000;sim.activeFlows.forEach((f,i)=>{const a=positions.get(f.source),b=positions.get(f.target);if(!a||!b)return;const p=(t*1.2+i*.13)%1;ctx.fillStyle=f.actionType==="debunk"?"#27ae60":"#ff7a45";ctx.beginPath();ctx.arc(a.x+(b.x-a.x)*p,a.y+(b.y-a.y)*p,3.5,0,Math.PI*2);ctx.fill()})}
      const hi=highlightAgentId(),t=performance.now()/1000;sim.nodes.forEach(n=>{const p=positions.get(n.id);if(!p)return;const r=n.isHub?9:n.isBridge?7.5:6.5,pulse=n.osi>.72?Math.sin(t*5)*2+4:0;if(n.isHub||n.isBridge||n.osi>.72){ctx.strokeStyle=n.isHub?"#111827":n.isBridge?"#eb5757":"rgba(235,87,87,.52)";ctx.lineWidth=n.isHub?2.4:1.6;ctx.beginPath();ctx.arc(p.x,p.y,r+4+pulse,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=colors[n.currentState]||"#9aa4b2";ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();const on=n.id===hi;ctx.strokeStyle=on?(n.id===pinnedAgentId?"#2f80ed":"#111827"):"#fff";ctx.lineWidth=on?(n.id===pinnedAgentId?3.5:3):1.5;ctx.stroke()})}
    function renderSpeeches(){const rows=[...sim.speeches].reverse();speechPanel.innerHTML=rows.length?rows.map(s=>`<article class="speech ${s.recordType==="reflection"?"reflect":""}"><div class="meta"><span>T${s.timeStep} ${s.agentName}</span><span>${s.status} / ${s.actionType}</span></div><p>${s.content}</p><div class="meta"><span>情绪 ${s.emotionIntensity} | 立场 ${s.stance}</span><span>OSI ${s.osi} / CPI ${s.cpi}</span></div></article>`).join(""):"<p>等待仿真产生言论。</p>"}
    function syncAgentCardHighlight(){if(!coeffPanel)return;const hi=highlightAgentId();coeffPanel.querySelectorAll(".agent-card").forEach(el=>el.classList.toggle("is-highlight",el.dataset.id===hi))}
    function bindAgentCards(){coeffPanel.querySelectorAll(".agent-card").forEach(card=>{card.onclick=ev=>{ev.stopPropagation();const agent=sim.nodes.find(n=>n.id===card.dataset.id);if(!agent)return;const rect=card.getBoundingClientRect();if(pinnedAgentId===agent.id)unpinAgent();else pinAgent(agent,{clientX:rect.left+rect.width+8,clientY:rect.top+rect.height/2});syncAgentCardHighlight()}})}
    function renderCoefficients(){const rows=sim.report.coefficients||[],labels=sim.stateLabels||{};const legend=STATE_KEYS.map(k=>`<span class="legend-item"><span class="legend-dot" style="background:${stateColor(k)}"></span>${labels[k]||k}</span>`).join("");coeffPanel.innerHTML=`<div class="coeff-hint">卡片左侧颜色与图中节点一致（按传播状态）。条形长度反映情绪、OSI、CPI 与激活压力比 H/θ。</div><div class="state-legend">${legend}</div><div class="agent-list">${rows.map(agentCardHtml).join("")}</div>`;bindAgentCards();syncAgentCardHighlight()}
    function agentDetailHtml(a){return `<div class="section"><strong>${a.id} / ${a.name}</strong>${a.profile}</div><div class="agent-grid"><div>人设<br><strong>${a.personaType}</strong></div><div>网络角色<br><strong>${a.networkRole}</strong></div><div>状态<br><strong>${a.stateLabel}</strong></div><div>度数<br><strong>${a.degree}</strong></div><div>情绪<br><strong>${a.emotionScore}</strong></div><div>立场<br><strong>${a.stanceScore}</strong></div><div>OSI<br><strong>${a.osi}</strong></div><div>CPI<br><strong>${a.cpi}</strong></div></div><div class="section"><strong>社会关系</strong><ul class="small-list">${a.relations.map(r=>`<li>${r.target_id}: ${r.relation_type}, 信任 ${r.trust_score}, 互动 ${r.interaction_count}</li>`).join("")}</ul></div><div class="section"><strong>最近记忆</strong><ul class="small-list">${a.memories.map(m=>`<li>${m.kind}: ${m.content}</li>`).join("")}</ul></div><div class="section"><strong>洞察反思</strong><ul class="small-list">${(a.reflections.length?a.reflections:[{content:"尚未触发反思。"}]).map(m=>`<li>${m.content}</li>`).join("")}</ul></div>`}
    function pickAgentAt(clientX,clientY){if(!sim)return null;const rect=canvas.getBoundingClientRect(),x=clientX-rect.left,y=clientY-rect.top;let nearest=null,best=Infinity;sim.nodes.forEach(n=>{const p=positions.get(n.id);if(!p)return;const d=Math.hypot(p.x-x,p.y-y);if(d<best){best=d;nearest=n}});return nearest&&best<18?nearest:null}
    function positionTooltipAt(clientX,clientY){const pad=12,offset=16,tip=agentTooltip;tip.style.left='0px';tip.style.top='0px';let x=clientX+offset,y=clientY+offset;const w=tip.offsetWidth,h=tip.offsetHeight;if(x+w>window.innerWidth-pad)x=clientX-w-offset;if(y+h>window.innerHeight-pad)y=clientY-h-offset;if(x<pad)x=pad;if(y<pad)y=pad;tip.style.left=x+'px';tip.style.top=y+'px'}
    function fillAgentTooltip(agent){agentTooltip.innerHTML=agentDetailHtml(agent);agentTooltip.dataset.agentId=agent.id}
    function showHoverTooltip(agent,e){if(pinnedAgentId)return;fillAgentTooltip(agent);agentTooltip.classList.add('visible');agentTooltip.classList.remove('pinned');agentTooltip.setAttribute('aria-hidden','false');positionTooltipAt(e.clientX,e.clientY)}
    function pinAgent(agent,e){pinnedAgentId=agent.id;hoverAgentId=agent.id;pinnedTooltipPos={x:e.clientX,y:e.clientY};fillAgentTooltip(agent);agentTooltip.classList.add('visible','pinned');agentTooltip.setAttribute('aria-hidden','false');positionTooltipAt(e.clientX,e.clientY);renderCanvas();syncAgentCardHighlight()}
    function unpinAgent(){const had=pinnedAgentId;pinnedAgentId=null;pinnedTooltipPos=null;agentTooltip.classList.remove('pinned');if(!hoverAgentId){delete agentTooltip.dataset.agentId;agentTooltip.classList.remove('visible');agentTooltip.setAttribute('aria-hidden','true')}if(had){renderCanvas();syncAgentCardHighlight()}}
    function syncPinnedTooltip(){if(!pinnedAgentId||!sim)return;const a=sim.nodes.find(n=>n.id===pinnedAgentId);if(!a){unpinAgent();return}fillAgentTooltip(a);agentTooltip.classList.add('visible','pinned');agentTooltip.setAttribute('aria-hidden','false');if(pinnedTooltipPos)positionTooltipAt(pinnedTooltipPos.x,pinnedTooltipPos.y)}
    function clearHoverTooltip(){const hadHover=hoverAgentId&&!pinnedAgentId;hoverAgentId=pinnedAgentId||null;if(pinnedAgentId){if(hadHover)renderCanvas();return}delete agentTooltip.dataset.agentId;agentTooltip.classList.remove('visible');agentTooltip.setAttribute('aria-hidden','true');if(hadHover)renderCanvas()}
    function renderResearchReport(){const m=sim.report.networkMetrics, records=sim.report.researchRecords||{}, evidence=records.dialogueEvidence||[], keyRows=records.keyNodeTable||[], reflections=sim.report.reflectionDigest||[], states=sim.report.stateCounts||{}, constraints=sim.report.modelConstraints||{};markdownSource.textContent=sim.report.markdownReport||"";renderedReport.innerHTML=`<section class="report-title"><h1>社区网络传播机制解释报告</h1><p>面向论文记录：社区结构、复杂阈值约束、传播证据、关键节点、情绪/OSI/CPI/H/θ转折与反黑箱解释。</p></section><section class="report-grid"><div class="report-stat"><span>时间步</span><strong>${sim.timeStep}</strong></div><div class="report-stat"><span>节点 / 边</span><strong>${m.nodeCount}/${m.edgeCount}</strong></div><div class="report-stat"><span>平均 OSI</span><strong>${m.averageOsi}</strong></div><div class="report-stat"><span>平均 CPI</span><strong>${m.averageCpi}</strong></div></section><section class="report-card accent-blue"><h3>一、实验网络设定</h3><ul><li>网络类型：${sim.sceneName}，${sim.model}</li><li>结构说明：${sim.description}</li><li>模型约束：${constraints.activationRule||"H_i(t) >= theta_i"}，社区内权重 ${constraints.intraCommunityWeight||1.0}，跨社区权重 ${constraints.interCommunityWeight||0.45}，桥接加权 ${constraints.bridgeBonus||1.3}</li><li>社区内边比例：${m.modularityProxy}</li><li>状态计数：${Object.entries(states).map(([k,v])=>`${k} ${v}`).join("；")||"暂无"}</li><li>当前风险等级：${sim.report.riskLevel}</li><li>情绪趋势：${sim.report.emotionTrend}</li></ul></section><section class="report-card accent-orange"><h3>二、关键节点与解释变量</h3>${keyRows.length?keyRows.map(r=>`<div class="evidence"><strong>${r.id} ${r.name}</strong>｜${r.persona}<br>度数 ${r.degree} / 情绪 ${r.emotion} / OSI ${r.osi} / CPI ${r.cpi} / H ${r.pressure} / θ ${r.threshold}<br><span class="meta">最近记忆：${r.memory}</span></div>`).join(""):"<p>暂无关键节点记录。</p>"}</section><section class="report-card accent-green"><h3>三、代表性言论证据</h3>${evidence.length?evidence.map(s=>`<div class="evidence"><strong>T${s.timeStep} ${s.speaker}</strong> -> ${(s.receivers||[]).join(", ")} ${s.touchesKeyNode?"<span class='tag'>触达关键节点</span>":""}<br>${s.content}<br><span class="meta">动作 ${s.actionType} / 情绪 ${s.emotion} / OSI ${s.osi} / CPI ${s.cpi}</span></div>`).join(""):"<p>尚无足够对话证据。</p>"}</section><section class="report-card accent-purple"><h3>四、洞察反思与转折点</h3><ul>${reflections.map(x=>`<li>${x}</li>`).join("")}</ul></section><section class="report-card"><h3>五、反黑箱说明</h3><p>该文档记录了社区结构、交互边、Agent 人设记忆、复杂阈值变量和代表性言论。论文中可以据此解释为什么社区内部更容易形成强化，为什么跨社区传播需要桥接节点，以及某个节点为何进入传播、质疑、辟谣或沉默状态。</p></section>`}
    canvas.addEventListener("mousemove",e=>{const agent=pickAgentAt(e.clientX,e.clientY);if(agent){if(hoverAgentId!==agent.id){hoverAgentId=agent.id;renderCanvas();syncAgentCardHighlight()}showHoverTooltip(agent,e)}else{const nextHover=pinnedAgentId||null;if(hoverAgentId!==nextHover){hoverAgentId=nextHover;renderCanvas()}if(!pinnedAgentId)clearHoverTooltip()}});
    canvas.addEventListener("mouseleave",()=>clearHoverTooltip());
    canvas.addEventListener("click",e=>{const agent=pickAgentAt(e.clientX,e.clientY);if(agent){if(pinnedAgentId===agent.id)unpinAgent();else pinAgent(agent,e)}else unpinAgent()});
    agentTooltip.addEventListener("wheel",e=>e.stopPropagation(),{passive:true});

    $("startBtn").onclick=start;$("pauseBtn").onclick=stop;$("stepBtn").onclick=()=>step();$("resetBtn").onclick=()=>reset();$("interventionBtn").onclick=()=>step({target_nodes:sim.report.keyNodes.slice(0,3),content:"补充完整时间线、来源说明和现场证据，建议关键节点引用。"});
    $("reportBtn").onclick=()=>{reportModal.classList.add("open");markdownSource.classList.remove("open");renderResearchReport()};$("closeReportBtn").onclick=()=>reportModal.classList.remove("open");$("modalBackdrop").onclick=()=>reportModal.classList.remove("open");toggleMarkdownBtn.onclick=()=>markdownSource.classList.toggle("open");
    window.addEventListener("resize",()=>{lastLayoutKey="";if(sim){ensureLayout();renderAll()}else if(pinnedTooltipPos)syncPinnedTooltip()});function loop(){if(sim)renderCanvas();requestAnimationFrame(loop)}loadState().then(loop);
  </script>
</body>
</html>
